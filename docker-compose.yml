version: '3.8'

services:
  # PostgreSQL 数据库
  postgres:
    image: postgres:14-alpine
    container_name: douhuiai-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-douhuiai_db}
      POSTGRES_USER: ${POSTGRES_USER:-douhuiai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-douhuiai_password}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-douhuiai}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - douhuiai-network
    restart: unless-stopped

  # Redis
  redis:
    image: redis:7-alpine
    container_name: douhuiai-redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis123}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - douhuiai-network
    restart: unless-stopped

  # 后端 API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: douhuiai-backend
    environment:
      # 数据库配置
      DATABASE_URL: postgresql://${POSTGRES_USER:-douhuiai}:${POSTGRES_PASSWORD:-douhuiai_password}@postgres:5432/${POSTGRES_DB:-douhuiai_db}
      # Redis配置
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis123}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-redis123}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-redis123}@redis:6379/2
      # 应用配置
      APP_NAME: ${APP_NAME:-Douhuiai AI Platform}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DEBUG: ${DEBUG:-True}
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-change-in-production}
      # 跨域配置
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
      # JWT配置
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      # 豆绘AI API
      DOUHUIAI_API_URL: ${DOUHUIAI_API_URL:-https://dhd.douhuiai.com}
      DOUHUIAI_APP_ID: ${DOUHUIAI_APP_ID}
      DOUHUIAI_APP_SECRET: ${DOUHUIAI_APP_SECRET}
      DOUHUIAI_IMG_BASE_URL: ${DOUHUIAI_IMG_BASE_URL:-https://img2.douhuiai.com/dhimg/}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend/app:/app/app
      - ./backend/logs:/app/logs
      - ./backend/uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - douhuiai-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # Celery Worker
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: douhuiai-celery-worker
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-douhuiai}:${POSTGRES_PASSWORD:-douhuiai_password}@postgres:5432/${POSTGRES_DB:-douhuiai_db}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis123}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-redis123}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-redis123}@redis:6379/2
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-change-in-production}
      DOUHUIAI_API_URL: ${DOUHUIAI_API_URL:-https://dhd.douhuiai.com}
      DOUHUIAI_APP_ID: ${DOUHUIAI_APP_ID}
      DOUHUIAI_APP_SECRET: ${DOUHUIAI_APP_SECRET}
      DOUHUIAI_IMG_BASE_URL: ${DOUHUIAI_IMG_BASE_URL:-https://img2.douhuiai.com/dhimg/}
    volumes:
      - ./backend/app:/app/app
      - ./backend/logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - douhuiai-network
    restart: unless-stopped
    command: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=4

  # Celery Beat - 定时任务
  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: douhuiai-celery-beat
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-douhuiai}:${POSTGRES_PASSWORD:-douhuiai_password}@postgres:5432/${POSTGRES_DB:-douhuiai_db}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis123}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-redis123}@redis:6379/1
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-change-in-production}
    volumes:
      - ./backend/app:/app/app
      - ./backend/logs:/app/logs
      - celery_beat_data:/app/celerybeat-data
    depends_on:
      - redis
    networks:
      - douhuiai-network
    restart: unless-stopped
    command: celery -A app.tasks.celery_app beat --loglevel=info --schedule=/app/celerybeat-data/celerybeat-schedule

  # 前端
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    container_name: douhuiai-frontend
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend
    networks:
      - douhuiai-network
    restart: unless-stopped

  # 管理后台（待添加）
  # admin:
  #   build:
  #     context: ./admin
  #     dockerfile: Dockerfile
  #   container_name: douhuiai-admin
  #   ports:
  #     - "3001:80"
  #   depends_on:
  #     - backend
  #   networks:
  #     - douhuiai-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  celery_beat_data:
    driver: local

networks:
  douhuiai-network:
    driver: bridge
